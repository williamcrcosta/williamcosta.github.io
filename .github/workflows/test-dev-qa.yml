name: "Test dev-qa"

on:
  push:
    branches:
      - dev-qa
  pull_request:
    branches:
      - dev-qa
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: "development"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Check for broken links (summary)
        if: failure()
        run: echo "⚠️ Testes falharam! Verifique os logs acima para detalhes."

      - name: Success message
        if: success()
        run: echo "✅ Build e testes concluídos com sucesso! Branch dev-qa está pronta para merge."
