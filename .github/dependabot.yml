version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    target-branch: dev-qa
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - bundler
    # Chirpy 7 é migração major — avaliação manual (backlog-tecnico.md)
    ignore:
      - dependency-name: jekyll-theme-chirpy
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev-qa
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
