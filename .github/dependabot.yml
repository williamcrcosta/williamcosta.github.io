version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    target-branch: dev-qa
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - bundler
    # jekyll 4.4 exige Chirpy 7 — ver backlog-tecnico.md
    ignore:
      - dependency-name: jekyll
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev-qa
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
